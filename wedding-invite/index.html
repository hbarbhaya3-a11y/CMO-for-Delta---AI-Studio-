<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/*
  Animated wedding invitation (standalone, no build step).
  Customise via URL params, e.g.
  index.html?family=Kapadia%20%26%20Master%20Family&groom=Harshit&bride=Rukhmani&date=JANUARY%2027,%202026
*/
:root{
  --gold:#e8b85a; --gold-hi:#fbe3a1; --gold-dk:#8a5a1c; --wood:#6b3b16; --wood-dk:#3d1f0a;
  --ink:#5a3410; --sky1:#f6c98a; --sky2:#e48a4c; --bg:#1a0f08;
  --dur:12s;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;overflow:hidden}
.stage{position:relative;width:min(100vw,calc(100vh*9/16));aspect-ratio:9/16;max-height:100vh;overflow:hidden;border-radius:14px;
  background:linear-gradient(180deg,#f3b675 0%,var(--sky1) 35%,#f0a564 60%,#c96a33 100%);box-shadow:0 20px 60px #000a;container-type:inline-size}
.layer{position:absolute;inset:0}

/* ---------- the world that zooms toward the doors ---------- */
.world{transform-origin:50% 52%;animation:zoom var(--dur) cubic-bezier(.55,0,.35,1) infinite}
@keyframes zoom{0%,22%{transform:scale(1)}55%,100%{transform:scale(1.18)}}

/* distant palace silhouettes */
.palace{position:absolute;bottom:40%;width:30%;height:22%;opacity:.55}
.palace.l{left:-6%}.palace.r{right:-6%;transform:scaleX(-1)}

/* stone wall + arch frame */
.wall{position:absolute;left:12%;right:12%;top:26%;bottom:18%;
  background:linear-gradient(180deg,#c58848,#a8692f 60%,#7a4419);border-radius:46% 46% 0 0/22% 22% 0 0;
  box-shadow:inset 0 0 40px #4a2508aa}
.wall::before{content:"";position:absolute;inset:4% 7% 0;border-radius:46% 46% 0 0/22% 22% 0 0;
  border:3px solid #f0c27a88;border-bottom:0}

/* reveal behind the doors: the invitation card */
.reveal{position:absolute;left:20%;right:20%;top:33%;bottom:18%;border-radius:46% 46% 0 0/20% 20% 0 0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#fff6dc 0%,#f8d69a 40%,#e7a85e 80%,#c47a3a 100%)}
.reveal .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fffbe8,transparent 60%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}

/* invitation card - fades in over the zoomed scene */
.card{position:absolute;left:22%;right:22%;top:33%;text-align:center;color:var(--ink);opacity:0;
  animation:card var(--dur) ease-out infinite}
@keyframes card{0%,42%{opacity:0;transform:translateY(12px)}55%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
.card .emblem{width:28cqw;height:28cqw;margin:0 auto 2cqw}
.card .family{font-size:2.9cqw;font-weight:600;line-height:1.3;letter-spacing:.02em}
.card .name{font-family:'Great Vibes',cursive;font-size:8.5cqw;line-height:1.05;color:#6a3a10}
.card .amp{font-family:'Great Vibes',cursive;font-size:6cqw;line-height:.9}
.card .rule{width:30%;height:1px;margin:1.5cqw auto;background:linear-gradient(90deg,transparent,var(--gold-dk),transparent)}
.card .date{font-family:'Cinzel',serif;font-weight:700;font-size:4cqw;letter-spacing:.06em}

/* doors */
.doors{position:absolute;left:20%;right:20%;top:33%;bottom:18%;perspective:900px;border-radius:46% 46% 0 0/20% 20% 0 0;overflow:hidden}
.door{position:absolute;top:0;bottom:0;width:50%;
  background:
    repeating-linear-gradient(90deg,#0000 0 18px,#0000001a 18px 19px),
    linear-gradient(180deg,#8b4e1e,var(--wood) 50%,var(--wood-dk));
  box-shadow:inset 0 0 0 3px #c88a3c,inset 0 0 30px #000a;animation-duration:var(--dur);animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.6,0,.3,1)}
.door.l{left:0;transform-origin:0 50%;animation-name:openL}
.door.r{right:0;transform-origin:100% 50%;animation-name:openR}
@keyframes openL{0%,16%{transform:rotateY(0)}45%,100%{transform:rotateY(-105deg)}}
@keyframes openR{0%,16%{transform:rotateY(0)}45%,100%{transform:rotateY(105deg)}}
.door .panel{position:absolute;left:14%;right:14%;height:22%;border:3px solid #d9a050;border-radius:6px;
  background:radial-gradient(circle,#b97a36 0 18%,transparent 19% 28%,#a0652a 29% 34%,transparent 35%),#7a4419;box-shadow:inset 0 0 12px #000a}
.door .panel:nth-child(1){top:12%}.door .panel:nth-child(2){top:40%}.door .panel:nth-child(3){top:68%}
.door .knob{position:absolute;top:52%;width:9px;height:9px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 6px var(--gold)}
.door.l .knob{right:6%}.door.r .knob{left:6%}
/* light leaking through the seam */
.seam{position:absolute;left:50%;top:33%;bottom:18%;width:6px;margin-left:-3px;
  background:linear-gradient(180deg,#fff8,#fff 30%,#ffe9a8);filter:blur(2px);box-shadow:0 0 20px 6px #ffd98a;
  animation:seam var(--dur) linear infinite}
@keyframes seam{0%{opacity:.4}8%,16%{opacity:1}24%,100%{opacity:0}}

/* floral arch (fades as doors open) */
.arch{position:absolute;left:10%;right:10%;top:29%;bottom:18%;animation:archFade var(--dur) ease-in infinite}
@keyframes archFade{0%,24%{opacity:1}42%,100%{opacity:0}}
.flower{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.marigold{position:absolute;width:1.6%;border-radius:3px;
  background:repeating-linear-gradient(180deg,#f59a1b 0 6px,#ffcc33 6px 12px);transform-origin:top;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(2deg)}}

/* hanging signboard */
.sign{position:absolute;left:5%;right:5%;top:3%;height:24%;animation:signRise var(--dur) ease-in-out infinite}
@keyframes signRise{0%,30%{transform:none;opacity:1}55%,100%{transform:translateY(-6%) scale(.92);opacity:1}}
.sign .board{position:absolute;left:10%;right:10%;top:24%;bottom:20%;border-radius:6px;
  background:linear-gradient(180deg,#f6dcaa,#e9c27f);box-shadow:0 0 0 4px var(--gold),0 0 0 7px var(--gold-dk),0 8px 20px #0006;
  display:flex;align-items:center;justify-content:center}
.sign h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:10cqw;white-space:nowrap;color:#7a4a17;text-shadow:0 1px 0 #fff8;letter-spacing:.01em}
.sign svg{position:absolute;inset:0;width:100%;height:100%}
.chain{position:absolute;top:0;width:2px;height:26%;background:repeating-linear-gradient(180deg,var(--gold) 0 4px,var(--gold-dk) 4px 6px)}

/* lanterns */
.lantern{position:absolute;top:27%;width:8%;transform-origin:50% -40%;animation:swing 2.6s ease-in-out infinite alternate}
.lantern.l{left:4%}.lantern.r{right:4%;animation-delay:-1.3s}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}

/* crowd */
.crowd{position:absolute;left:0;right:0;bottom:0;height:30%;animation:crowd var(--dur) ease-in-out infinite}
@keyframes crowd{0%,20%{transform:none}55%,100%{transform:translateY(8%) scale(1.06)}}
.person{position:absolute;bottom:0;transform-origin:50% 100%;animation:dance 1.1s ease-in-out infinite alternate}
@keyframes dance{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-4%) rotate(3deg)}}
.floor{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(180deg,#c88a4a,#8a5226);
  background-image:repeating-linear-gradient(90deg,#0000 0 12.5%,#0002 12.5% calc(12.5% + 1px)),linear-gradient(180deg,#d39656,#8a5226)}

/* petals */
.petal{position:absolute;top:-5%;width:2.4%;aspect-ratio:1/1.3;border-radius:60% 0 60% 0;background:radial-gradient(circle at 30% 30%,#fff,#ffe1e6 60%,#f6b6c2);
  opacity:0;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.95}100%{opacity:.9;transform:translate(var(--dx),115cqh) rotate(540deg)}}
.petals{opacity:0;animation:petalsOn var(--dur) linear infinite}
@keyframes petalsOn{0%,30%{opacity:0}40%,96%{opacity:1}100%{opacity:0}}

/* end flash */
.flash{background:#fff5df;opacity:0;pointer-events:none;animation:flash var(--dur) ease-in-out infinite}
@keyframes flash{0%{opacity:.8}5%{opacity:0}90%{opacity:0}100%{opacity:.8}}

/* envelope icon + controls */
.env{position:absolute;top:2.5%;right:3%;width:11%;aspect-ratio:1.35;background:#fdf6ea;border-radius:3px;box-shadow:0 2px 6px #0004;z-index:5}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,transparent 49%,#e7d6bd 50% 52%,transparent 53%),linear-gradient(-155deg,transparent 49%,#e7d6bd 50% 52%,transparent 53%)}
.env::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:#e0303f;font-size:4.5cqw}
.ctrl{position:absolute;left:4%;bottom:2.5%;z-index:6;display:flex;gap:8px}
.ctrl button{width:9cqw;height:9cqw;border:0;border-radius:50%;background:#0006;color:#fff;font-size:4cqw;cursor:pointer;backdrop-filter:blur(4px)}
.stage.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.petal,.person,.lantern{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="layer world">
    <!-- distant palaces -->
    <svg class="palace l" viewBox="0 0 100 70" preserveAspectRatio="none"><path fill="#c77a45" d="M0 70V30h10V18l5-6 5 6v12h12V20q8-14 16 0v10h12V14q8-12 16 0v16h12v40z"/></svg>
    <svg class="palace r" viewBox="0 0 100 70" preserveAspectRatio="none"><path fill="#c77a45" d="M0 70V30h10V18l5-6 5 6v12h12V20q8-14 16 0v10h12V14q8-12 16 0v16h12v40z"/></svg>

    <div class="wall"></div>
    <div class="reveal"><div class="glow"></div>
      <!-- faint courtyard pillars -->
      <svg viewBox="0 0 100 160" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;opacity:.25">
        <g fill="#c98a4a"><rect x="6" y="40" width="8" height="120"/><rect x="86" y="40" width="8" height="120"/><path d="M14 60q36-40 72 0v-6q-36-40-72 0z"/></g>
      </svg>
    </div>
    <div class="seam"></div>
    <div class="doors">
      <div class="door l"><div class="panel"></div><div class="panel"></div><div class="panel"></div><div class="knob"></div></div>
      <div class="door r"><div class="panel"></div><div class="panel"></div><div class="panel"></div><div class="knob"></div></div>
    </div>
    <div class="arch" id="arch"></div>

    <div class="floor"></div>
  </div>

  <!-- invitation text -->
  <div class="card">
    <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="#7a4a17" stroke-width="1.6">
        <circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="25" stroke-width=".8"/>
        <g id="petalRing"></g>
      </g>
      <text x="50" y="60" text-anchor="middle" font-size="28" fill="#7a4a17" font-family="serif">ॐ</text>
    </svg>
    <p class="family"><span id="family">Kapadia &amp; Master Family</span> cordially<br>invites you to celebrate the union of</p>
    <p class="name" id="groom">Harshit</p>
    <p class="amp">&amp;</p>
    <p class="name" id="bride">Rukhmani</p>
    <div class="rule"></div>
    <p class="date" id="date">JANUARY 27, 2026</p>
  </div>

  <div class="crowd" id="crowd"></div>

  <!-- lanterns -->
  <svg class="lantern l" viewBox="0 0 40 80"><use href="#lanternG"/></svg>
  <svg class="lantern r" viewBox="0 0 40 80"><use href="#lanternG"/></svg>

  <!-- signboard -->
  <div class="sign">
    <div class="chain" style="left:22%"></div><div class="chain" style="right:22%"></div>
    <svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3a1"/><stop offset=".5" stop-color="#e2a948"/><stop offset="1" stop-color="#8a5a1c"/></linearGradient></defs>
      <g fill="url(#g)">
        <!-- top crest -->
        <path d="M38 10q12-12 24 0q-6-2-12 3q-6-5-12-3z"/><circle cx="50" cy="6" r="2"/>
        <!-- side scrolls -->
        <path d="M2 12q8-4 9 6q1 10-7 10q5-3 3-8q-1-5-5-8z"/><path d="M98 12q-8-4-9 6q-1 10 7 10q-5-3-3-8q1-5 5-8z"/>
        <!-- bottom pendant -->
        <path d="M40 32q10 10 20 0q-4 6-10 8q-6-2-10-8z"/><circle cx="50" cy="37" r="1.6"/>
      </g>
    </svg>
    <div class="board"><h1>Wedding Invite</h1></div>
  </div>

  <div class="layer petals" id="petals"></div>
  <div class="layer flash"></div>
  <div class="env" title="Invitation"></div>
  <div class="ctrl"><button id="play" aria-label="Pause">❚❚</button><button id="replay" aria-label="Replay">↻</button></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="lglow"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffb84a"/><stop offset="1" stop-color="#c06a1a" stop-opacity="0"/></radialGradient>
      <g id="lanternG">
        <line x1="20" y1="0" x2="20" y2="12" stroke="#5a3410" stroke-width="1.5"/>
        <circle cx="20" cy="42" r="22" fill="url(#lglow)" opacity=".7"/>
        <path d="M10 18h20l-4-6H14z" fill="#3d2410"/>
        <rect x="11" y="18" width="18" height="34" rx="3" fill="#ffd36e" stroke="#3d2410" stroke-width="2.5"/>
        <path d="M20 18v34M11 35h18" stroke="#3d2410" stroke-width="1.5"/>
        <path d="M10 52h20l-4 6H14z" fill="#3d2410"/><circle cx="20" cy="62" r="2" fill="#3d2410"/>
      </g>
    </defs>
  </svg>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  // --- custom text from URL ---
  const q = new URLSearchParams(location.search);
  for (const k of ['family','groom','bride','date']) if (q.get(k)) $(k).textContent = q.get(k);

  // --- emblem petal ring ---
  const ring = $('petalRing');
  for (let i = 0; i < 16; i++) {
    const a = i * 22.5;
    ring.insertAdjacentHTML('beforeend',
      `<ellipse cx="50" cy="13" rx="3.2" ry="6" transform="rotate(${a} 50 50)"/>`);
  }

  // --- floral arch: flowers on a parabola + hanging marigold strings ---
  const arch = $('arch'), cols = ['#f4a3a8','#fbd1b0','#f6e1c4','#e88a6a','#a9b7dc','#f7c26b','#fff0e0','#d9708a'];
  const pts = 70;
  for (let i = 0; i < pts; i++) {
    const t = i / (pts - 1);                 // 0..1 along the arch
    const ang = Math.PI * (1 - t);
    // semicircle top, straight legs
    let x, y;
    const legs = 0.3;
    if (t < legs) { x = 4; y = 100 - (t / legs) * 62; }
    else if (t > 1 - legs) { x = 96; y = 38 + ((t - (1 - legs)) / legs) * 62; }
    else { const u = (t - legs) / (1 - 2 * legs); const a = Math.PI * (1 - u); x = 50 + 46 * Math.cos(a); y = 38 - 30 * Math.sin(a); }
    for (let j = 0; j < 3; j++) {
      const s = 4 + Math.random() * 4, c = cols[(Math.random() * cols.length) | 0];
      const f = document.createElement('div');
      f.className = 'flower';
      f.style.cssText = `left:${x + (Math.random()-.5)*7}%;top:${y + (Math.random()-.5)*4}%;width:${s}%;aspect-ratio:1;
        background:radial-gradient(circle,#fff8 0 15%,${c} 16% 60%,color-mix(in srgb,${c},#000 25%) 61%);`;
      arch.appendChild(f);
    }
  }
  for (let i = 0; i < 12; i++) {
    const m = document.createElement('div');
    m.className = 'marigold';
    const x = 18 + i * 5.8, h = 18 + Math.sin(i / 11 * Math.PI) * 14;
    m.style.cssText = `left:${x}%;top:${9 + Math.abs(5.5 - i) * 1.2}%;height:${h}%;animation-delay:${-i * .3}s`;
    arch.appendChild(m);
  }

  // --- dancing crowd (simple stylised figures) ---
  const crowd = $('crowd');
  const outfits = ['#1e7f8c','#e8a21c','#c9372c','#f2c14e','#2f5d9a','#e46a2e','#8a2a6b','#f0e2c0','#3a8f5a'];
  const people = [
    {x:2,h:78,drum:true},{x:14,h:66},{x:24,h:72},{x:34,h:62},{x:44,h:70},{x:54,h:64},{x:63,h:72},{x:73,h:66},{x:84,h:78,drum:true}
  ];
  people.forEach((p, i) => {
    const c = outfits[i % outfits.length], skin = ['#c68a5c','#b97a4d','#d59a6a'][i % 3];
    const el = document.createElement('div');
    el.className = 'person';
    el.style.cssText = `left:${p.x}%;width:14%;height:${p.h}%;animation-delay:${-i * .17}s;animation-duration:${.9 + (i % 3) * .15}s`;
    el.innerHTML = `<svg viewBox="0 0 40 100" preserveAspectRatio="xMidYMax meet" style="width:100%;height:100%">
      <path d="M20 30 L6 100 H34 Z" fill="${c}"/>
      <path d="M20 30 L30 100 H34 L22 30Z" fill="#0002"/>
      <path d="M14 34 Q4 46 ${i%2?2:8} ${i%2?30:58}" stroke="${skin}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M26 34 Q36 46 ${i%2?38:32} ${i%2?58:28}" stroke="${skin}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="9" fill="${skin}"/>
      <path d="M11 18 q9 -14 18 0 q-2 -8 -9 -8 q-7 0 -9 8z" fill="#2a160a"/>
      ${p.drum ? `<ellipse cx="20" cy="60" rx="15" ry="9" fill="#a8582a" stroke="#f2c14e" stroke-width="2"/>
                  <path d="M6 56 L34 64 M6 64 L34 56" stroke="#f2c14e" stroke-width="1"/>` : ''}
    </svg>`;
    crowd.appendChild(el);
  });

  // --- petals ---
  const petals = $('petals');
  for (let i = 0; i < 34; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const d = 4 + Math.random() * 4;
    p.style.cssText = `left:${Math.random()*100}%;--dx:${(Math.random()-.5)*30}cqw;animation-duration:${d}s;
      animation-delay:${-Math.random()*d}s;width:${1.6+Math.random()*2}%`;
    petals.appendChild(p);
  }

  // --- controls ---
  const stage = $('stage'), play = $('play');
  play.onclick = () => {
    const paused = stage.classList.toggle('paused');
    play.textContent = paused ? '▶' : '❚❚';
    play.setAttribute('aria-label', paused ? 'Play' : 'Pause');
  };
  $('replay').onclick = () => {
    stage.getAnimations({subtree:true}).forEach(a => { if (a.effect && a.effect.getTiming().duration === 12000) a.currentTime = 0; });
  };
})();
</script>
</body>
</html>
